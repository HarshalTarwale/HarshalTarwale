# Save this at:  .github/workflows/snake.yml
# in your HarshalTarwale/HarshalTarwale repo.
#
# It generates the contribution-snake SVGs into an "output" branch,
# which the README pulls from. Runs every 12 hours + on demand.

name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: HarshalTarwale
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#E23636
            dist/snake-dark.svg?palette=github-dark&color_snake=#E23636

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
